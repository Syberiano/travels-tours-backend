# Configuración de la Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/travels_db?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para PostgreSQL moderno
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Importante: Diferir la inicialización del data.sql hasta que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
# Asegurar que el script se ejecute siempre en desarrollo
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Configuración de Seguridad JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A
jwt.expiration=86400000
jwt.refresh.expiration=604800000

logging.level.com.travels.backend=DEBUG